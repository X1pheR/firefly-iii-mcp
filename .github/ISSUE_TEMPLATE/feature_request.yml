name: Feature request
description: Propose a bounded semantic Firefly III read workflow or product improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project intentionally does not expose the full Firefly III API. New tools should represent useful agent workflows and preserve the read-only, bounded-data design.
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What financial question or workflow should the MCP make easier?
    validations:
      required: true
  - type: textarea
    id: current-gap
    attributes:
      label: Current gap
      description: Why are the existing semantic tools insufficient?
    validations:
      required: true
  - type: textarea
    id: proposed-shape
    attributes:
      label: Proposed behavior
      description: Describe the desired inputs/output at a semantic level. Avoid real financial data.
  - type: checkboxes
    id: boundary
    attributes:
      label: Boundary check
      options:
        - label: The request can remain strictly read-only.
          required: true
        - label: The request does not require arbitrary HTTP/path execution, exports or attachments.
          required: true
