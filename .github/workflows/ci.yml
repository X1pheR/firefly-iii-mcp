name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Verify accepted source contract
        run: ./scripts/verify.sh
