[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hypershell-firefly-iii-mcp"
version = "0.2.0"
description = "Bounded semantic MCP server for safe, read-only Firefly III financial analysis"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{ name = "Ronald de Wit" }]
keywords = ["firefly-iii", "mcp", "model-context-protocol", "finance", "read-only"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "fastmcp==3.4.7",
  "httpx==0.28.1",
]

[project.scripts]
firefly-iii-mcp = "firefly_iii_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/X1pheR/firefly-iii-mcp"
Issues = "https://github.com/X1pheR/firefly-iii-mcp/issues"
Upstream = "https://github.com/firefly-iii/firefly-iii"

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["src/firefly_iii_mcp"]
